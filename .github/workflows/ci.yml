name: LOLA Admin CI

on:
  push:
    branches:
      - main
      - work/lola-admin-integration-2026-11-07
  pull_request:
    branches:
      - main
      - work/lola-admin-integration-2026-11-07

permissions:
  contents: read

concurrency:
  group: lola-admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: BFF security regression tests
        run: npm test
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify no server secrets in browser bundle
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'LOLA_ADMIN_API_KEY|LOLA_ADMIN_SESSION_SECRET|x-admin-key' dist/assets; then
            echo "Server-only credential marker found in browser bundle."
            exit 1
          fi
