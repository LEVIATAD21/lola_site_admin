name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm test
      - name: Cloudflare API security and photo contracts
        run: |
          node --check functions/_shared/adminApi.js
          node --check functions/_shared/finance.js
          node --check functions/api/finance.js
          node --check functions/api/webhooks/asaas.js
          node --check functions/api/login.js
          node --check functions/api/session.js
          node --check functions/api/logout.js
          node --check functions/api/health.js
          node --check functions/api/public-config.js
          node --check functions/api/admin/catalog.js
          node --check 'functions/api/admin/catalog/[id].js'
          node --check 'functions/api/admin/imagens/[id].js'
          node --check functions/api/estoque/definir.js
          node --test tests/cloudflare.test.mjs
      - run: npm run build
      - name: Validate public admin distribution
        run: node scripts/verify-pages-admin.mjs
