name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 1 * * 0'

concurrency:
  group: codeql-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          # Repositórios privados sem GitHub Code Security não aceitam SARIF upload.
          # Mantemos a análise real e arquivamos o SARIF como artefato auditável.
          upload: false

      - name: Stage CodeQL SARIF results inside workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codeql-results
          cp ../results/*.sarif codeql-results/

      - name: Archive CodeQL SARIF results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14
